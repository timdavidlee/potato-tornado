[project]
name = "potato-tornado"
version = "0.13.0"
description = "Synthetic dataset generators for teaching, backed by DuckDB / Postgres."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "tim.lee" }]
keywords = ["synthetic-data", "teaching", "duckdb", "postgres", "datasets"]

dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "faker>=25.0",
    "typer>=0.12",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# Postgres sink support. Kept optional so the core install stays light.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "connectorx>=0.3",
]

[project.scripts]
potato-tornado = "potato_tornado.cli:app"

[dependency-groups]
# Dev tooling, installed by `uv sync` but not shipped to consumers.
dev = [
    "pyright>=1.1.380",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "commitizen>=4.16.4",
    "pre-commit>=4.6.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potato_tornado"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]              # asserts are expected in tests
"src/potato_tornado/cli.py" = ["B008"] # typer.Option() in defaults is the idiomatic pattern

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.13.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
